name: SwiftGears
options:
  bundleIdPrefix: com.wouterwisse
  deploymentTarget:
    iOS: "17.0"
packages:
  GearsCore:
    path: .
targets:
  SwiftGears:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [AppIcon.icon/**]
      # An Icon Composer document: one file to Xcode, layered Liquid Glass on iOS 26+.
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Shared
    dependencies:
      - package: GearsCore
      - target: SwiftGearsWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SwiftGears
        NSBluetoothAlwaysUsageDescription: SwiftGears connects to your trainer and Zwift Ride to change gears.
        # Keeps shifting while another training app is in front or the phone is locked.
        UIBackgroundModes: [bluetooth-central]
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wouterwisse.swiftgears
        DEVELOPMENT_TEAM: Q6AEA497G4
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The Live Activity on the Lock Screen and in the Dynamic Island.
  SwiftGearsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: GearsCore
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: SwiftGears
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wouterwisse.swiftgears.widgets
        DEVELOPMENT_TEAM: Q6AEA497G4
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
